name: Build iOS Simulator app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild \
            -project SpinControls.xcodeproj \
            -scheme SpinControls \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Debug-iphonesimulator/SpinControls.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" SpinControls-Simulator-Debug.zip

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpinControls-Simulator-Debug
          path: SpinControls-Simulator-Debug.zip
          if-no-files-found: error
